# Starter CI: lint + unit tests for every track on every push and pull request.
# Pending tests are skipped, so this is green on day one. In Phase 5 you replace this file with the full pipeline
# (path filters, data and model tests + coverage gate, notebook / R Markdown execution, the evaluation gate, parity
# across tracks). Every concept used here is explained in docs/github-actions-explained.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.track }} · lint + unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        track: [python, sql, r]
    defaults:
      run:
        working-directory: tracks/${{ matrix.track }}
    steps:
      - uses: actions/checkout@v4

      - if: matrix.track != 'r'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tracks/${{ matrix.track }}/requirements-dev.txt
      - name: Install dependencies
        if: matrix.track != 'r'
        run: make install

      # R: the pinned toolchain image (R 4.6.1 + a dated CRAN snapshot), the same one you use locally.
      - if: matrix.track == 'r'
        uses: docker/setup-buildx-action@v3
      - name: Build the R toolchain image (cached between runs)
        if: matrix.track == 'r'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tracks/r/Dockerfile
          target: dev
          tags: churncast-r-dev:ci
          load: true
          cache-from: type=gha,scope=r-dev
          cache-to: type=gha,mode=max,scope=r-dev
      - name: Run make inside the R image (or directly for Python and SQL)
        run: |
          if [ "${{ matrix.track }}" = r ]; then
            echo "IN=docker run --rm --network none -u $(id -u):$(id -g) -e HOME=/tmp -v ${{ github.workspace }}:/repo -w /repo/tracks/r churncast-r-dev:ci" >> "$GITHUB_ENV"
          else
            echo "IN=" >> "$GITHUB_ENV"
          fi

      - name: Lint
        run: $IN make lint
      - name: Unit tests
        run: $IN make test
